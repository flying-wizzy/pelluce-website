<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelluce</title>
  <meta name="description" content="Pelluce — coming soon.">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23131F3A'/><text x='32' y='45' font-family='Montserrat,sans-serif' font-size='40' font-weight='600' fill='%23fff' text-anchor='middle'>P</text></svg>">

  <link rel="preload" href="fonts/montserrat-latin-var.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    @font-face {
      font-family: "Montserrat";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("fonts/montserrat-latin-var.woff2") format("woff2");
    }

    :root {
      --ink: #131F3A;
      --ground: #ffffff;
      color-scheme: light;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 1.5rem;
      box-sizing: border-box;
      background: var(--ground);
      color: var(--ink);
      font-family: Montserrat, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      text-align: center;
    }

    .wordmark {
      margin: 0;
      font-weight: 600;
      font-size: clamp(1.75rem, 9vw, 4.5rem);
      letter-spacing: 0.28em;
      /* Trailing letter-space pushes the line left; indent by the same amount to re-centre. */
      text-indent: 0.28em;
      text-transform: uppercase;
    }

    .tagline {
      margin: 1.75rem 0 0;
      font-weight: 400;
      font-size: clamp(0.75rem, 2.2vw, 0.9rem);
      letter-spacing: 0.22em;
      text-indent: 0.22em;
      text-transform: uppercase;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="wordmark">Pelluce</h1>
    <p class="tagline">Coming soon</p>
  </main>
</body>
</html>
